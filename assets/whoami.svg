<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Shreyansh Kourav — whoami</title>

  <!-- Background -->
  <rect width="800" height="280" rx="10" fill="#0d1117"/>

  <!-- Top bar — terminal chrome -->
  <rect width="800" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="800" height="10" fill="#161b22"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="22" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">shreyansh@github ~ $ whoami</text>

  <!-- Left accent bar -->
  <rect x="24" y="52" width="3" height="200" rx="2" fill="#fc9867" opacity="0.6"/>

  <!-- Name -->
  <text x="44" y="80" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="700" fill="#fc9867">Shreyansh Kourav</text>

  <!-- Role line -->
  <text x="44" y="108" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">role</text>
  <text x="110" y="108" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6e7681">→</text>
  <text x="132" y="108" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e6edf3">Software Engineer</text>
  <text x="310" y="108" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#3fb950"> · backend-heavy, full-stack capable</text>

  <!-- Focus -->
  <text x="44" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">focus</text>
  <text x="110" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6e7681">→</text>
  <text x="132" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e6edf3">Distributed Systems</text>
  <text x="286" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#fc9867"> · </text>
  <text x="306" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e6edf3">Backend Architecture</text>
  <text x="474" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#fc9867"> · </text>
  <text x="494" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e6edf3">DevOps</text>

  <!-- Location -->
  <text x="44" y="156" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">location</text>
  <text x="110" y="156" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6e7681">→</text>
  <text x="132" y="156" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e6edf3">Indore, India</text>

  <!-- Status -->
  <text x="44" y="180" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">status</text>
  <text x="110" y="180" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6e7681">→</text>
  <!-- Green dot -->
  <circle cx="138" cy="176" r="5" fill="#3fb950"/>
  <text x="152" y="180" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#3fb950">Open to opportunities</text>

  <!-- Divider -->
  <line x1="24" y1="200" x2="776" y2="200" stroke="#21262d" stroke-width="1"/>

  <!-- Philosophy quote -->
  <text x="44" y="224" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">// I care about</text>
  <text x="185" y="224" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#fc9867">how</text>
  <text x="218" y="224" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">things are built, not just</text>
  <text x="458" y="224" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#fc9867">that</text>
  <text x="493" y="224" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">they work.</text>

  <text x="44" y="248" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">// Clean code, proper abstractions, systems that don't fall apart at 3am.</text>

  <!-- Blinking cursor -->
  <rect x="590" y="235" width="9" height="16" rx="1" fill="#fc9867" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>